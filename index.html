<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reversa | 逆暗証トレーニング</title>
    <meta name="description" content="聴覚だけで文字を記憶し、逆から答える。Whisper APIを用いた高精度な脳トレ。">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&family=Noto+Sans+JP:wght@300;400;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=20260429_1357">
</head>

<body>
    <!-- Character Flash Overlay -->
    <div id="flash-container" class="flash-container hidden">
        <div id="flash-character" class="flash-character"></div>
    </div>

    <div class="background">
        <!-- Dynamic Background Layer -->
        <div id="dynamic-bg" class="dynamic-bg"></div>
        <div class="circle circle-1"></div>
        <div class="circle circle-2"></div>
    </div>

    <main class="container">
        <!-- Level Selection Screen -->
        <section id="screen-home" class="screen active">
            <header>
                <h1>Reversa</h1>
                <p class="subtitle">逆暗証メモリトレーニング</p>
            </header>
            <div class="glass-card">
                <h2 class="home-instruction">
                    読み上げられた音を逆順に答えてください。<br>
                    文字数を選択してください。<br>
                    <small>1セット3問です。</small>
                </h2>
                <div class="theme-grid" id="theme-options">
                    <button class="theme-card beginner-card" onclick="startGame('beginner')">
                        <h3>初級編</h3>
                        <p>和の幻想</p>
                    </button>
                    <button class="theme-card intermediate-card" onclick="startGame('intermediate')">
                        <h3>中級編</h3>
                        <p>日常と自然</p>
                    </button>
                    <button class="theme-card advanced-card" onclick="startGame('advanced')">
                        <h3>上級編</h3>
                        <p>長い言葉</p>
                    </button>
                </div>
                <div class="mode-settings">
                    <div class="toggle-container">
                        <span class="toggle-label">🔇 音声なしモード</span>
                        <label class="switch">
                            <input type="checkbox" id="check-silent">
                            <span class="slider round"></span>
                        </label>
                    </div>
                    <div class="toggle-container">
                        <span class="toggle-label">🙈 文字を隠す (聴覚のみモード)</span>
                        <label class="switch">
                            <input type="checkbox" id="check-blind" checked>
                            <span class="slider round"></span>
                        </label>
                    </div>
                </div>
            </div>
            <div class="home-footer">
                <span class="version-tag">Ver 0.0.1</span>
                <button id="btn-open-dev" class="dev-link-button">開発者メニュー 🛠️</button>
            </div>
        </section>

        <section id="screen-loading" class="screen">
            <div class="glass-card loading-card">
                <div class="loading-spinner"></div>
                <h2 id="loading-title"></h2>
                <div class="loading-progress-container">
                    <div id="loading-bar" class="loading-bar"></div>
                </div>
                <p id="loading-status">0 / 3 完了</p>
                <button id="btn-start-after-load" class="start-button hidden">トレーニングを開始する</button>
            </div>
        </section>

        <!-- Game Screen -->
        <section id="screen-game" class="screen">
            <div class="status-bar">
                <span id="label-level">Level: 3</span>
                <span id="label-progress">1 / 10</span>
                <span id="label-score">Score: 0</span>
            </div>
            <div class="glass-card game-card">
                <!-- Status: Reading -->
                <div id="voice-indicator" class="voice-indicator">
                    <div class="wave"></div>
                    <div class="wave"></div>
                    <div class="wave"></div>
                    <p id="game-status" class="hidden"></p>
                </div>

                <!-- Status: Recording (Whisper) -->
                <div id="recording-container" class="recognition-container hidden">
                    <div id="mic-area" class="mic-area">
                        <div class="recording-visualizer">
                            <canvas id="game-waveform-canvas" class="game-waveform"></canvas>
                            <div class="pulse-ring"></div>
                            <div class="mic-icon" id="voice-indicator">🎤</div>
                        </div>
                    </div>
                    <p class="recording-status" id="recording-status">準備ができたら開始してください</p>
                    <div class="recording-timer-group">
                        <p class="recording-timer-text" id="recording-timer-text">自動停止まで：<span id="recording-countdown">3</span>秒</p>
                        <div class="recording-timer-bar-bg" id="recording-timer-bar"></div>
                    </div>

                    <div id="action-choice-group" class="action-choice-group hidden">
                        <button id="btn-retry-record" class="choice-button primary">🎙️ 音声を聞き直して答える</button>
                        <button id="btn-skip-question" class="choice-button secondary">⏭️ スキップする</button>
                    </div>
                </div>

                <!-- Status: Feedback -->
                <div id="feedback-panel" class="feedback-panel hidden">
                    <div class="feedback-badge-container">
                        <div id="feedback-badge" class="feedback-badge">正解</div>
                    </div>

                    <div class="comparison-grid minimal">
                        <div class="comparison-item">
                            <span class="text-label">【正解】</span>
                            <span id="display-correct-reverse" class="text-success large-text">-</span>
                        </div>
                        <div class="comparison-item hidden" id="user-answer-container">
                            <span class="text-label text-wrong-label">【あなたの声】</span>
                            <span id="display-user-answer" class="text-wrong medium-text strikethrough">-</span>
                        </div>
                    </div>
                    <button id="btn-next" class="primary-button">次へ</button>
                </div>
            </div>
        </section>

        <!-- Result Screen -->
        <section id="screen-result" class="screen">
            <div class="glass-card result-card">
                <h2>結果発表</h2>
                <div class="accuracy-display">
                    <svg viewBox="0 0 36 36" class="circular-chart">
                        <path class="circle-bg"
                            d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                        <path id="accuracy-path" class="circle" stroke-dasharray="0, 100"
                            d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                        <text x="18" y="20.35" class="percentage" id="accuracy-text">0%</text>
                    </svg>
                </div>
                <p id="result-message"></p>
                <div id="result-history-list" class="history-list"></div>
                <div class="result-actions">
                    <button id="btn-restart" class="primary-button">再挑戦</button>
                    <button id="btn-export-log" class="secondary-button">解析用ログを保存</button>
                </div>
            </div>
        </section>

        <!-- Developer Studio Screen -->
        <section id="screen-dev" class="screen">
            <div class="dev-layout">
                <aside class="dev-sidebar">
                    <h3>Recording Studio</h3>
                    <button id="btn-dev-back" class="secondary-button mini-btn">← 戻る</button>
                    <nav class="dev-nav">
                        <button class="nav-item active" data-tab="moras">50音</button>
                        <button class="nav-item" data-tab="words">単語</button>
                        <button class="nav-item" data-tab="pilot">🚀 パイロット</button>
                    </nav>
                    <div id="dev-list-container" class="dev-list-container">
                        <!-- JSで生成 -->
                    </div>
                </aside>
                <main class="dev-main">
                    <div id="dev-recording-card" class="glass-card dev-card">
                        <div class="target-display">
                            <div class="dev-target-card">
                                <div class="pilot-progress hidden" id="pilot-progress">
                                    <span class="progress-label">進捗:</span>
                                    <span id="pilot-status">0 / 40</span>
                                    <div class="progress-bar-bg">
                                        <div id="pilot-bar" class="progress-bar-fill"></div>
                                    </div>
                                </div>
                                <h2 id="dev-target-text" class="dev-target-text">準備中</h2>
                            </div>

                            <!-- NEW: Rhythm/Metronome UI -->
                            <div id="metronome-area" class="metronome-container hidden">
                                <div class="pendulum"></div>
                                <div id="recording-beat-indicator" class="beat-indicator"></div>
                                <div id="rhythm-countdown" class="rhythm-countdown"></div>
                            </div>

                            <!-- NEW: Static Waveform Review -->
                            <div id="waveform-preview" class="waveform-container hidden">
                                <canvas id="waveform-canvas-static"></canvas>
                                <div class="trim-guides">
                                    <div class="guide-start"></div>
                                    <div class="guide-end"></div>
                                </div>
                            </div>

                            <div class="wave-visualizer">
                                <canvas id="waveform-canvas"></canvas>
                            </div>
                            <div class="dev-actions">
                                <button id="btn-record-dev" class="record-button">🔴 手動録音</button>
                                <button id="btn-record-rhythm" class="rhythm-button">⚖️ リズム録音</button>
                                <button id="btn-play-dev" class="play-button hidden">▶ 再生確認</button>
                                <button id="btn-save-dev" class="save-button hidden">💾 保存して次へ</button>
                            </div>
                            <div class="dev-tools">
                                <button id="btn-test-mora" class="tool-button">あいうえお 🔊</button>
                                <button id="btn-test-ka" class="tool-button">かきくけこ 🔊</button>
                                <button id="btn-test-sa" class="tool-button">さしすせそ 🔊</button>
                                <button id="btn-test-ta" class="tool-button">たちつてと 🔊</button>
                                <button id="btn-test-na" class="tool-button">なにぬねの 🔊</button>
                                <button id="btn-test-ha" class="tool-button">はひふへほ 🔊</button>
                                <button id="btn-test-ma" class="tool-button">まみむめも 🔊</button>
                                <button id="btn-test-ya" class="tool-button">やゆよ 🔊</button>
                                <button id="btn-test-wa" class="tool-button">わをん 🔊</button>
                                <button id="btn-test-hashi" class="tool-button">はし 🔊</button>
                            </div>
                            <p id="dev-status" class="status-msg">リストから文字を選んでください</p>
                        </div>
                </main>
            </div>
        </section>
    </main>

    <!-- Configure Secrets & Dependencies -->
    <script src="assets/js/vapi.js"></script>
    <script src="questions.js?v=20260429_1124"></script>
    <script src="config.js?v=20260429_1201"></script>
    <script src="app.js?v=20260429_1402"></script>
</body>

</html>
