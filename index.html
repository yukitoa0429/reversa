<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reversa | 逆暗証トレーニング</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Frederick+the+Great&family=Kiwi+Maru:wght@300;400;500&family=Outfit:wght@400;600;800&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/screens/home.css">
    <link rel="stylesheet" href="css/screens/game.css">
    <link rel="stylesheet" href="css/screens/result.css">
</head>
<body>
    <div class="background">
        <div id="dynamic-bg" class="dynamic-bg"></div>
    </div>

    <main class="container">
        <!-- 文字フラッシュ演出用 -->
        <div id="flash-container" class="flash-container hidden">
            <div id="flash-character" class="flash-character"></div>
            <div class="flash-label">聞いて</div>
        </div>

        <!-- 1. ホーム画面 -->
        <section id="screen-home" class="screen active">
            <header>
                <h1>Reversa</h1>
                <p class="subtitle">逆暗証メモリトレーニング</p>
            </header>
            <div class="glass-card">
                <h2 class="home-instruction">
                    読み上げられた音を逆順に答えてください。<br>
                    文字数を選択してください。<br>
                    <small>1セット10問です。</small>
                </h2>
                <div class="level-grid">
                    <button class="level-button beginner-card" id="btn-beginner">
                        初級編<br><small>和の幻想</small>
                    </button>
                    <button class="level-button intermediate-card" id="btn-intermediate">
                        中級編<br><small>日常と自然</small>
                    </button>
                    <button class="level-button advanced-card" id="btn-advanced">
                        上級編<br><small>長い言葉</small>
                    </button>
                </div>
                <div class="home-settings">
                    <div class="toggle-container">
                        <span>🔇 音声なしモード</span>
                        <input type="checkbox" id="check-silent">
                    </div>
                    <div class="toggle-container">
                        <span>🙈 文字を隠す</span>
                        <input type="checkbox" id="check-blind" checked>
                    </div>
                    <div class="toggle-container">
                        <span>🗣️ 連続音モード</span>
                        <input type="checkbox" id="check-natural" checked>
                    </div>
                </div>
            </div>
            <div class="home-footer">
                <span class="version-tag">0.2.0</span>
                <button id="btn-open-dev" class="secondary-button">開発者メニュー 🛠️</button>
            </div>
        </section>

        <!-- 2. ローディング画面 -->
        <section id="screen-loading" class="screen">
            <div class="glass-card">
                <h2 id="loading-title">音声を準備しています</h2>
                <div class="loading-spinner"></div>
                <div class="progress-container">
                    <div id="loading-bar" style="width: 0%; height: 10px; background: var(--chalk-yellow);"></div>
                </div>
                <p id="loading-status">0 / 10 準備中...</p>
                <button id="btn-start-after-load" class="primary-button hidden">
                    トレーニングを開始 🚀
                </button>
            </div>
        </section>

        <!-- 3. ゲーム画面 -->
        <section id="screen-game" class="screen">
            <div class="game-card">
                <div class="status-bar">
                    <span id="label-level">LEVEL</span>
                    <span id="label-progress">0 / 10</span>
                    <span id="label-score">Score: 0</span>
                </div>

                <!-- 待機中アニメーション -->
                <div id="voice-indicator" class="voice-indicator">
                    <div class="wave"></div>
                    <div class="wave"></div>
                    <div class="wave"></div>
                    <p>再生中...</p>
                </div>

                <!-- 録音中演出 -->
                <div id="recording-container" class="recognition-container hidden">
                    <div class="mic-area">
                        <div class="pulse-ring"></div>
                        <p id="recording-status">お答えください</p>
                        <canvas id="game-waveform-canvas" class="game-waveform"></canvas>
                    </div>
                    <button id="btn-skip-question" class="stop-button">スキップ</button>
                </div>

                <!-- 判定フィードバック -->
                <div id="feedback-panel" class="feedback-panel hidden">
                    <div id="feedback-badge" class="feedback-badge"></div>
                    <div id="user-answer-container">
                        <p>あなたの回答: <span id="display-user-answer"></span></p>
                        <p>正解: <span id="display-correct-reverse" class="text-success"></span></p>
                    </div>
                    <button id="btn-next" class="primary-button">次へ</button>
                </div>
            </div>
        </section>

        <!-- 4. リザルト画面 -->
        <section id="screen-result" class="screen">
            <div class="result-card glass-card">
                <h2>トレーニング終了！</h2>
                <div class="accuracy-display">
                    <svg viewBox="0 0 36 36">
                        <path class="circle-bg" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                        <path id="accuracy-path" class="circle" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                        <text x="18" y="20.35" class="percentage" id="accuracy-text">0%</text>
                    </svg>
                </div>
                <p id="result-message"></p>
                <div id="result-history-list" class="history-list"></div>
                <div class="result-actions">
                    <button id="btn-restart" class="primary-button">もう一度</button>
                    <button id="btn-export-log" class="secondary-button">ログを保存</button>
                </div>
            </div>
        </section>

        <!-- 5. 開発者スタジオ -->
        <section id="screen-dev" class="screen">
            <div class="dev-layout glass-card">
                <header>
                    <h2>開発者スタジオ</h2>
                    <button id="btn-dev-back" class="secondary-button">戻る</button>
                </header>
                <div class="dev-main">
                    <p id="dev-status">メンテナンスモード</p>
                </div>
            </div>
        </section>
    </main>

    <!-- 依存関係 -->
    <script src="questions.js"></script>
    <script src="config.js"></script>
    
    <!-- メインロジック -->
    <script type="module" src="js/game.js"></script>
</body>
</html>
